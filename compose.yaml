name: aevyra-messaging-gateway
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Поставете POSTGRES_DB во .env.admin}
      POSTGRES_USER: ${POSTGRES_USER:?Поставете POSTGRES_USER во .env.admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Поставете POSTGRES_PASSWORD во .env.admin}
      TZ: Europe/Skopje
      PGTZ: Europe/Skopje
    command: ["postgres", "-c", "timezone=Europe/Skopje"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  postgres_data:
